name: CI Pipeline

on:
  push:
    branches: [main, develop, "feature/*", "fix/*"]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Job 1: Code Quality ──────────────────────────────────
  lint:
    name: Code quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-dev-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: pip-dev-

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run black (formatter check)
        run: black --check src/ tests/ dashboard/

      - name: Run isort (import order check)
        run: isort --check-only src/ tests/ dashboard/

      - name: Run flake8 (linter)
        run: flake8 src/ tests/ dashboard/ --max-line-length=88 --extend-ignore=E203

  # ── Job 2: Tests ─────────────────────────────────────────
  test:
    name: Run test suite
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ── Job 3: Security scan ─────────────────────────────────
  security:
    name: Security scan
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit security scan
        run: bandit -r src/ -ll -ii